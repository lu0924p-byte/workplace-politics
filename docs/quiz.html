<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>職場政治敏感度自我評估量表｜職場政治學</title>
  <meta name="description" content="20 題完整職場政治敏感度自我評估量表，依原始計分方式顯示四象限、三項能力分數與改善建議。">
  <meta name="theme-color" content="#41544A">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/content-data.js" defer></script>
  <script src="assets/js/quiz-data.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/quiz.js" defer></script>
</head>
<body data-page="quiz">
  <div data-site-header></div>
  <main id="main-content">
    <header class="page-hero">
      <div class="container page-hero-grid page-hero-grid--single">
        <div class="reveal">
          <p class="eyebrow">附錄二・線上版</p>
          <h1>職場政治敏感度自我評估量表</h1>
          <p class="lede">共二十題，診斷政治盲點分布，對應三大能力圖譜，找出最該強化的象限</p>
        </div>
      </div>
    </header>

    <section class="section section--paper" aria-labelledby="instructions-title">
      <div class="container quiz-instructions-layout">
        <div class="prose quiz-instructions__copy reveal">
          <p class="eyebrow">作答說明</p>
          <h2 id="instructions-title">依你「此刻」的真實情況作答</h2>
          <p class="lede">別想太多，依你最近３到６個月的真實工作情況請憑直覺回答！</p>
          <aside class="score-guide" aria-label="平均分數判讀線">
            <p class="eyebrow">平均分數判讀</p>
            <div class="score-guide__line" aria-hidden="true"><span></span><i></i></div>
            <div class="score-guide__labels"><span><b>3.0–3.4</b>灰色帶，先當成弱項顧</span><span><b>≧ 3.5</b>高</span></div>
          </aside>
        </div>
        <figure class="quiz-instructions__king reveal"><img src="assets/images/gold-king-transparent.png" alt="金色國王棋" width="813" height="1933" loading="lazy"></figure>
      </div>
    </section>

    <section class="section section--mist" aria-label="量表互動區">
      <div class="container">
        <div class="quiz-shell reveal" id="quiz-shell" data-quiz tabindex="-1">
          <div class="quiz-head">
            <span class="quiz-count" data-quiz-count>01 / 20</span>
            <span class="quiz-progress" aria-hidden="true"><i data-quiz-progress></i></span>
            <span class="quiz-dim" data-quiz-dimension>個人職能｜自保與表達</span>
          </div>
          <div class="quiz-body">
            <div class="quiz-stage" data-quiz-stage>
              <p class="quiz-question" data-quiz-question>題目載入中……</p>
              <div class="scale-options" data-quiz-options></div>
              <div class="scale-legend"><span>完全不符合</span><span>完全符合</span></div>
              <div class="quiz-controls"><button class="link-button" type="button" data-quiz-back>回上一題</button><button class="link-button" type="button" data-quiz-reset>重新開始</button></div>
            </div>
            <div class="quiz-result" data-quiz-result tabindex="-1">
              <div class="result-summary">
                <p class="result-score" data-result-score></p>
                <h2 class="result-name" data-result-name></h2>
                <p class="result-coord" data-result-coord></p>
                <p class="result-description" data-result-description></p>
              </div>
              <div class="quadrant-map" aria-label="能力圖譜">
                <div class="quadrant-cell" data-quadrant="watch"><strong>觀察者困境</strong><span>高看懂 × 低出手</span></div>
                <div class="quadrant-cell" data-quadrant="strat"><strong>策略區</strong><span>高看懂 × 高出手</span></div>
                <div class="quadrant-cell" data-quadrant="blind"><strong>政治盲區</strong><span>低看懂 × 低出手</span></div>
                <div class="quadrant-cell" data-quadrant="rash"><strong>莽動帶</strong><span>低看懂 × 高出手</span></div>
              </div>
              <div class="ability-bars" data-result-bars></div>
              <div class="advice-note"><h3 data-advice-title></h3><p data-advice-text></p></div>
              <div class="result-actions"><button class="button button--light" type="button" data-quiz-share>複製我的結果</button><button class="button button--light" type="button" data-quiz-again>再測一次</button></div>
            </div>
          </div>
        </div>
        <p class="quiz-note reveal">這張分數只是你「此刻」的切片；書中另附紙本計分工作表與能力圖譜。</p>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
